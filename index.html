<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPPC Covilhã - Links</title>
    <!-- fonte Poppins do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- biblioteca de ícones Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <!-- Card principal -->
      <div class="page-card">
        <!-- Cabeçalho com Logo e Nome -->
        <header class="header">
          <img
            src="./assets/IPPC_logo_noBG.png"
            alt="Logo IPP Covilhã"
            class="profile-img"
          />
          <h1 class="profile-name">
            Igreja Portugal para Cristo <br />
            Covilhã
          </h1>
          <p class="profile-bio">
            Uma família para pertencer<br />
            Cultos: Domingos | 10h<br />
            Pequenos Grupos: Quartas | horários abaixo <br />
            Sala de oração: Segundas | 19h00
          </p>
        </header>

        <!-- Links Principais -->
        <div id="links-container"></div>

        <!-- Rodapé -->
        <footer class="footer">
          <p>
            &copy; 2026 Igreja Portugal para Cristo - Covilhã. <br />
            Todos os direitos reservados.
          </p>

          <div class="credits-area">
            <p class="developed-by">
              Desenvolvido por <br />
              <strong>Hudson Peres & MangoDev Digital Solutions</strong>
            </p>

            <a
              href="http://mangodev.tech/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="./assets/mangodev.png"
                alt="MangoDev Digital Solutions Logo"
                class="mangodev-logo"
              />
            </a>
          </div>
        </footer>
      </div>
    </main>

    <script src="script.js"></script>
    <script>
      fetch("links.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("links-container").innerHTML = data;
        })
        .catch((error) => console.error("Erro ao carregar os links:", error));
    </script>
  </body>
</html>
